services:
  - type: web
    name: palung-io
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # Isi DATA_DIR dengan mount path persistent disk (plan berbayar) agar statistik awet:
      # - key: DATA_DIR
      #   value: /var/data
